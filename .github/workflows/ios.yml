name: iOS build and TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Inject backend config
        run: |
          python3 - <<'PY'
          import re
          p = 'project.yml'
          s = open(p).read()
          s = s.replace('        GENERATE_INFOPLIST_FILE: YES',
                        '        GENERATE_INFOPLIST_FILE: YES\n'
                        '        INFOPLIST_KEY_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}\n'
                        '        INFOPLIST_KEY_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}')
          open(p,'w').write(s)
          PY

      - name: Resolve build number from TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: |
          python3 -m pip install --quiet pyjwt cryptography requests
          echo "$ASC_KEY_P8" > /tmp/asc.p8
          python3 - <<'PY' >> $GITHUB_ENV
          import jwt, time, os, requests
          key = open('/tmp/asc.p8').read()
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()),
                            "exp": int(time.time())+1200, "aud": "appstoreconnect-v1"},
                           key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"]})
          r = requests.get("https://api.appstoreconnect.apple.com/v1/builds",
                           params={"filter[app]": os.environ["ASC_APP_ID"], "limit": 200},
                           headers={"Authorization": f"Bearer {tok}"}).json()
          nums = [int(b["attributes"]["version"]) for b in r.get("data", [])
                  if str(b["attributes"].get("version","")).isdigit()]
          print(f"BUILD_NUMBER={max(nums)+1 if nums else 1}")
          PY

      - name: Stamp build number
        run: |
          sed -i '' "s/MARKETING_VERSION: \"1.0\"/MARKETING_VERSION: \"1.0\"\n    CURRENT_PROJECT_VERSION: \"$BUILD_NUMBER\"/" project.yml

      - name: Generate project
        run: xcodegen generate

      - name: Import signing certificate
        env:
          P12: ${{ secrets.APPLE_DIST_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
        run: |
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security set-keychain-settings build.keychain
          curl -sO https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import AppleWWDRCAG3.cer -k build.keychain -T /usr/bin/codesign || true
          echo "$P12" | base64 --decode > dist.p12
          security import dist.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          security list-keychains -s build.keychain

      - name: Install provisioning profile
        env:
          PROFILE: ${{ secrets.APPLE_PROVISION_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/lilystream.mobileprovision

      - name: Archive
        run: |
          xcodebuild -project LilyStream.xcodeproj -scheme LilyStream \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/LilyStream.xcarchive archive

      - name: Export IPA
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>XF783932R2</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>com.connor.lilystream</key><string>LilyStream CI</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/LilyStream.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LilyStream-ipa
          path: build/ipa/*.ipa

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          IPA=$(ls build/ipa/*.ipa | head -1)
          set +e
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee upload.log
          CODE=${PIPESTATUS[0]}
          set -e
          # altool exits non-zero on a 409 even after the binary has landed, so
          # confirm by polling for the build rather than blind-retrying.
          if [ "$CODE" != "0" ]; then
            echo "altool exit $CODE - polling App Store Connect for build $BUILD_NUMBER"
            sleep 90
            python3 - <<'PY'
          import jwt, time, os, requests, sys
          key = open(os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{os.environ['ASC_KEY_ID']}.p8")).read()
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()),
                            "exp": int(time.time())+1200, "aud": "appstoreconnect-v1"},
                           key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"]})
          want = os.environ.get("BUILD_NUMBER")
          r = requests.get("https://api.appstoreconnect.apple.com/v1/builds",
                           params={"filter[app]": os.environ["ASC_APP_ID"], "limit": 200},
                           headers={"Authorization": f"Bearer {tok}"}).json()
          found = [b for b in r.get("data", []) if b["attributes"].get("version") == want]
          print("build present:", bool(found))
          sys.exit(0 if found else 1)
          PY
          fi
