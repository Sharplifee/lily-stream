name: iOS build and TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Inject backend config
        run: |
          /usr/libexec/PlistBuddy -c "Add :SUPABASE_URL string ${{ secrets.SUPABASE_URL }}" Info.plist 2>/dev/null || true
        continue-on-error: true

      - name: Generate project
        run: xcodegen generate

      - name: Import signing certificate
        env:
          P12: ${{ secrets.APPLE_DIST_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
        run: |
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security set-keychain-settings build.keychain
          curl -sO https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import AppleWWDRCAG3.cer -k build.keychain -T /usr/bin/codesign || true
          echo "$P12" | base64 --decode > dist.p12
          security import dist.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          security list-keychains -s build.keychain

      - name: Install provisioning profile
        env:
          PROFILE: ${{ secrets.APPLE_PROVISION_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/lilystream.mobileprovision

      - name: Archive
        run: |
          xcodebuild -project LilyStream.xcodeproj -scheme LilyStream \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/LilyStream.xcarchive archive

      - name: Export IPA
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>XF783932R2</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>com.connor.lilystream</key><string>LilyStream CI</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/LilyStream.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LilyStream-ipa
          path: build/ipa/*.ipa
